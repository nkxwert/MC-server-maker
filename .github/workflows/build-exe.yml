name: Build EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Build EXE
        run: python build_exe.py

      - name: Check EXE starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MC-Server-Maker.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "EXE exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Item dist\MC-Server-Maker.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MC-Server-Maker-windows
          path: dist/MC-Server-Maker.exe
          if-no-files-found: error

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MC-Server-Maker.exe
          generate_release_notes: true
