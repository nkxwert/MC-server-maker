name: Build EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          # PyInstaller with its launcher (bootloader) compiled here instead of the prebuilt one
          # shared by many programs: antivirus programs flag this app far less often
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          python -m pip install --no-binary pyinstaller --no-cache-dir pyinstaller

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Build app folder
        run: python build_exe.py

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = python scripts/release_notes.py --version
          $defs = @("/DAppVersion=$ver", "/DSourceDir=..\dist\Bartizan")
          if (Test-Path (Join-Path (Split-Path $iscc) "Languages\Korean.isl")) { $defs += "/DHaveKorean" }
          & $iscc @defs installer\Bartizan.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\Bartizan-Setup.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Check install, start and uninstall
        shell: pwsh
        run: |
          $env:BARTIZAN_SELFTEST = "1"
          $env:MCSM_HOME = "$env:RUNNER_TEMP\bartizan-selftest-setup"
          $dir = "$env:RUNNER_TEMP\Installed Bartizan"
          $p = Start-Process -FilePath "dist\Bartizan-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -PassThru
          if (-not $p.WaitForExit(180000)) { Write-Error "setup did not finish"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "setup failed with code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$dir\Bartizan.exe")) { Write-Error "Bartizan.exe was not installed"; exit 1 }
          Start-Sleep -Seconds 15  # setup started the app; in self-test mode it quits by itself
          Get-Process Bartizan -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:MCSM_HOME = "$env:RUNNER_TEMP\bartizan-selftest-installed"
          $a = Start-Process -FilePath "$dir\Bartizan.exe" -PassThru
          $ok = $a.WaitForExit(90000)
          $log = "$env:MCSM_HOME\selftest.log"
          if (Test-Path $log) { Get-Content $log }
          if (-not $ok) { Stop-Process -Id $a.Id -Force; Write-Error "installed app did not start"; exit 1 }
          if ($a.ExitCode -ne 0) { Write-Error "installed app self-test failed with code $($a.ExitCode)"; exit 1 }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          $u.WaitForExit(120000) | Out-Null
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\Bartizan.exe") { Write-Error "uninstall left Bartizan.exe"; exit 1 }

      - name: Build portable EXE
        run: python build_exe.py --onefile

      - name: Check EXE starts
        shell: pwsh
        run: |
          # self-test mode: the app opens its window and exits with 0 after a few seconds.
          # A startup error shows a dialog instead (never exits) or exits non-zero.
          $env:BARTIZAN_SELFTEST = "1"
          $env:MCSM_HOME = "$env:RUNNER_TEMP\bartizan-selftest"
          $p = Start-Process -FilePath "dist\Bartizan.exe" -PassThru
          $ok = $p.WaitForExit(90000)
          $log = "$env:MCSM_HOME\selftest.log"
          if (Test-Path $log) { Get-Content $log }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; Write-Error "EXE did not finish starting (startup error?)"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "EXE self-test failed with code $($p.ExitCode)"; exit 1 }
          Get-Item dist\Bartizan.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Check in-place update
        shell: pwsh
        run: |
          # the downloaded new version installs itself over the old EXE, then starts it
          $env:BARTIZAN_SELFTEST = "1"
          $env:MCSM_HOME = "$env:RUNNER_TEMP\bartizan-selftest2"
          $dir = "$env:RUNNER_TEMP\app dir"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $target = "$dir\Bartizan.exe"
          Set-Content $target "old version"
          $p = Start-Process -FilePath "dist\Bartizan.exe" -ArgumentList "--bartizan-install", "`"$target`"", "0" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Error "installer did not finish"; exit 1 }
          if ((Get-FileHash $target).Hash -ne (Get-FileHash "dist\Bartizan.exe").Hash) { Write-Error "EXE was not replaced"; exit 1 }
          $extra = Get-ChildItem $dir | Where-Object { $_.Name -ne "Bartizan.exe" }
          if ($extra) { Write-Error "left files next to the EXE: $($extra.Name)"; exit 1 }
          Start-Sleep -Seconds 15  # the restarted app runs its own self-test and quits
          Get-Process Bartizan -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Bartizan-windows
          path: |
            dist/Bartizan.exe
            dist/Bartizan-Setup.exe
          if-no-files-found: error

  release:
    # Publishes a GitHub Release when APP_VERSION changes on the default branch.
    # The app's "Check for updates" downloads the EXE from here.
    name: Publish release
    needs: windows
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version
        id: v
        run: echo "version=$(python scripts/release_notes.py --version)" >> "$GITHUB_OUTPUT"

      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} is already released; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download EXE
        if: steps.exists.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: Bartizan-windows
          path: dist

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python scripts/release_notes.py > notes.md
          (cd dist && sha256sum Bartizan.exe | cut -d' ' -f1 > Bartizan.exe.sha256)
          (cd dist && sha256sum Bartizan-Setup.exe | cut -d' ' -f1 > Bartizan-Setup.exe.sha256)
          gh release create "v$VERSION" dist/Bartizan-Setup.exe dist/Bartizan-Setup.exe.sha256 \
            dist/Bartizan.exe dist/Bartizan.exe.sha256 \
            --title "Bartizan v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
